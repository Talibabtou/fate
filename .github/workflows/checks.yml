name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 11.23.0
  AGAVE_VERSION: 4.2.0
  SBF_VERSION: 4.1.0

jobs:
  checks:
    name: Biome, app, and program build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build app
        run: pnpm check

      - name: Install Agave toolchain
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL \"https://release.anza.xyz/v${AGAVE_VERSION}/install\")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install SBF build tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-build-sbf --version "$SBF_VERSION" --locked --force
          cargo-build-sbf --version
          cargo-test-sbf --version

      - name: Build program
        run: pnpm program:build:localnet

  deploy-preview:
    name: Deploy preview to Vercel
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --cwd app

      - name: Verify preview browser configuration
        shell: bash
        run: |
          set -euo pipefail
          env_file="app/.vercel/.env.preview.local"
          test -f "$env_file"
          for name in NEXT_PUBLIC_SOLANA_NETWORK NEXT_PUBLIC_FATE_PROGRAM_ID NEXT_PUBLIC_RPC_HTTP_URL NEXT_PUBLIC_RPC_WSS_URL NEXT_PUBLIC_PRIVY_APP_ID; do
            if ! grep -qE "^${name}=[^[:space:]]" "$env_file"; then
              echo "::error::Missing or empty Vercel preview variable: $name"
              exit 1
            fi
          done

      - name: Build Vercel output
        run: vercel build --token="$VERCEL_TOKEN" --cwd app

      - name: Deploy prebuilt preview
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN" --cwd app

  deploy-production:
    name: Deploy production to Vercel
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --cwd app

      - name: Verify production browser configuration
        shell: bash
        run: |
          set -euo pipefail
          env_file="app/.vercel/.env.production.local"
          test -f "$env_file"
          for name in NEXT_PUBLIC_SOLANA_NETWORK NEXT_PUBLIC_FATE_PROGRAM_ID NEXT_PUBLIC_RPC_HTTP_URL NEXT_PUBLIC_RPC_WSS_URL NEXT_PUBLIC_PRIVY_APP_ID; do
            if ! grep -qE "^${name}=[^[:space:]]" "$env_file"; then
              echo "::error::Missing or empty Vercel production variable: $name"
              exit 1
            fi
          done

      - name: Build Vercel output
        run: vercel build --prod --token="$VERCEL_TOKEN" --cwd app

      - name: Deploy prebuilt production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN" --cwd app
