name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  AGAVE_VERSION: 4.2.0
  SBF_VERSION: 4.1.0
  VERCEL_CLI_VERSION: 59.5.0

jobs:
  changes:
    name: Detect changed areas
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app == 'true' || steps.filter.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
      program: ${{ steps.filter.outputs.program == 'true' || steps.filter.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}
      docs: ${{ steps.filter.outputs.docs == 'true' || steps.filter.outputs.shared == 'true' || github.event_name == 'workflow_dispatch' }}

    steps:
      - uses: actions/checkout@v6

      - name: Detect changed areas
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            app:
              - 'app/**'
            program:
              - 'api/**'
              - 'program/**'
            docs:
              - '**/*.md'
            shared:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.markdownlint-cli2.jsonc'
              - 'package.json'
              - 'app/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'biome.json'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'

  app-checks:
    name: Biome, TypeScript, tests, and build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check app
        run: pnpm check

      - name: Build app
        run: pnpm app:build

  docs-checks:
    name: Markdown lint
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint Markdown
        run: pnpm markdownlint

  program-checks:
    name: Format, host tests, and SBF lifecycle tests
    needs: changes
    if: needs.changes.outputs.program == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run deterministic host tests
        run: NO_DNA=1 cargo test --workspace --features dev-randomness,fast-localnet

      - name: Run production-feature host tests
        run: NO_DNA=1 cargo test --workspace --no-default-features

      - name: Cache Agave toolchain
        id: agave-cache
        uses: actions/cache@v5
        with:
          path: ~/.local/share/solana/install
          key: ${{ runner.os }}-agave-${{ env.AGAVE_VERSION }}

      - name: Install Agave toolchain
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.agave-cache.outputs.cache-hit }}" != "true" ]]; then
            sh -c "$(curl -sSfL \"https://release.anza.xyz/v${AGAVE_VERSION}/install\")"
          fi
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Cache SBF build tools
        id: sbf-cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/bin/cargo-build-sbf
            ~/.cargo/bin/cargo-test-sbf
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-sbf-${{ env.SBF_VERSION }}-${{ hashFiles('rust-toolchain.toml') }}

      - name: Install SBF build tools
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ steps.sbf-cache.outputs.cache-hit }}" != "true" ]]; then
            cargo install cargo-build-sbf --version "$SBF_VERSION" --locked
          fi
          cargo-build-sbf --version
          cargo-test-sbf --version

      - name: Build deterministic SBF program
        run: NO_DNA=1 cargo build-sbf --features dev-randomness,fast-localnet -- --package fate-program

      - name: Run deterministic SBF lifecycle tests
        shell: bash
        run: |
          set -euo pipefail
          tests=(
            account_contract_matrix_rejects_substitution_signer_and_mutability
            conflicting_withdrawal_contention_allows_one_state_transition
            initialization_handles_prefunded_pdas_and_rejects_bad_targets
            paused_withdrawal_does_not_activate_until_unpaused
            per_wallet_positions_exceed_the_old_player_registry_cap
            staker_withdrawal_can_trigger_activation_after_repricing_the_threshold
            timed_transitions_reject_wrong_phases_and_replays
            weighted_path_compute_and_packet_budget
            weighted_path_operations_reconcile_economics_and_budget
            weighted_paths_settle_claim_and_release_draw_storage
          )
          for test_name in "${tests[@]}"; do
            echo "::group::SBF lifecycle test: $test_name"
            NO_DNA=1 cargo test-sbf --features dev-randomness,fast-localnet --package fate-program --test lifecycle "$test_name"
            echo "::endgroup::"
          done

      - name: Build production-feature SBF program
        run: NO_DNA=1 cargo build-sbf --no-default-features -- --package fate-program

      - name: Run production-feature SBF lifecycle tests
        run: NO_DNA=1 cargo test-sbf --no-default-features --package fate-program --test lifecycle -- --test-threads=1

  checks:
    name: Required checks
    needs: [changes, app-checks, program-checks, docs-checks]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      app_check_result: ${{ needs.app-checks.result }}

    steps:
      - name: Verify conditional checks
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          APP_RESULT: ${{ needs.app-checks.result }}
          PROGRAM_RESULT: ${{ needs.program-checks.result }}
          DOCS_RESULT: ${{ needs.docs-checks.result }}
        shell: bash
        run: |
          set -euo pipefail
          for result in "$CHANGES_RESULT" "$APP_RESULT" "$PROGRAM_RESULT" "$DOCS_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              echo "::error::A required CI job ended with: $result"
              exit 1
            fi
          done

  deploy-preview:
    name: Deploy preview to Vercel
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && needs.checks.result == 'success' && needs.checks.outputs.app_check_result == 'success' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Require Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel preview environment
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Verify preview browser configuration
        shell: bash
        run: |
          set -euo pipefail
          env_file=".vercel/.env.preview.local"
          test -f "$env_file"
          for name in NEXT_PUBLIC_SOLANA_NETWORK NEXT_PUBLIC_FATE_PROGRAM_ID NEXT_PUBLIC_RPC_HTTP_URL NEXT_PUBLIC_RPC_WSS_URL NEXT_PUBLIC_PRIVY_APP_ID; do
            if ! grep -qE "^${name}=[^[:space:]]" "$env_file"; then
              echo "::error::Missing or empty Vercel preview variable: $name"
              exit 1
            fi
          done

      - name: Build Vercel preview output
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt preview
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-production:
    name: Deploy production to Vercel
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: always() && needs.checks.result == 'success' && needs.checks.outputs.app_check_result == 'success' && github.event_name == 'push' && github.ref == 'refs/heads/main'

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Require Vercel secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Missing GitHub secret: $name"
              missing=1
            fi
          done
          exit "$missing"

      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Vercel CLI
        run: npm install --global vercel@${{ env.VERCEL_CLI_VERSION }}

      - name: Pull Vercel production environment
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Verify production browser configuration
        shell: bash
        run: |
          set -euo pipefail
          env_file=".vercel/.env.production.local"
          test -f "$env_file"
          for name in NEXT_PUBLIC_SOLANA_NETWORK NEXT_PUBLIC_FATE_PROGRAM_ID NEXT_PUBLIC_RPC_HTTP_URL NEXT_PUBLIC_RPC_WSS_URL NEXT_PUBLIC_PRIVY_APP_ID; do
            if ! grep -qE "^${name}=[^[:space:]]" "$env_file"; then
              echo "::error::Missing or empty Vercel production variable: $name"
              exit 1
            fi
          done

      - name: Build Vercel production output
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy prebuilt production
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
