name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 11.23.0
  AGAVE_VERSION: 4.2.0
  SBF_VERSION: 4.1.0
  STEEL_VERSION: 3.0.3

jobs:
  checks:
    name: Repository checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm check

  web-build:
    name: Web build and smoke
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm app:build

      - name: Start app and smoke test
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir app start > next-start.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl --fail --silent --show-error http://127.0.0.1:3000/ > /tmp/fate-home.html; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              cat next-start.log
              exit 1
            fi
            sleep 1
          done

          grep -q "Fate" /tmp/fate-home.html

  program:
    name: Program and artifact checks
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.local/share/solana/install
            target
          key: ${{ runner.os }}-fate-program-${{ env.AGAVE_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-fate-program-${{ env.AGAVE_VERSION }}-

      - name: Install Agave toolchain
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL \"https://release.anza.xyz/v${AGAVE_VERSION}/install\")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install Steel CLI
        run: cargo install steel-cli --version "$STEEL_VERSION" --locked

      - name: Install SBF build tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-build-sbf --version "$SBF_VERSION" --locked --force
          cargo-build-sbf --version
          cargo-test-sbf --version

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run host program tests
        run: |
          NO_DNA=1 cargo test --workspace --features dev-randomness,fast-localnet
          NO_DNA=1 cargo test --workspace --no-default-features

      - name: Build localnet SBF artifact
        run: NO_DNA=1 cargo build-sbf --features dev-randomness,fast-localnet -- --package fate-program

      - name: Run SBF lifecycle test
        run: NO_DNA=1 cargo test-sbf --test lifecycle -- --test-threads=1

      - name: Build production artifact
        run: NO_DNA=1 steel build

      - name: Verify deployable artifact
        run: test -s target/deploy/fate.so
