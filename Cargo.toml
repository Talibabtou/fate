[workspace]
resolver = "2"
members = ["api", "program"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/talibabtou/fate"

[workspace.dependencies]
fate-api = { path = "./api" }
num_enum = "0.7.6"
solana-program = "^2.1"
steel = "4.0.9"

[profile.dev]
overflow-checks = true

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
