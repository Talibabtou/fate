name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PNPM_VERSION: 11.23.0
  AGAVE_VERSION: 4.2.0
  SBF_VERSION: 4.1.0

jobs:
  checks:
    name: Biome, app, and program build
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Check and build app
        run: pnpm check

      - name: Install Agave toolchain
        shell: bash
        run: |
          set -euo pipefail
          sh -c "$(curl -sSfL \"https://release.anza.xyz/v${AGAVE_VERSION}/install\")"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Install SBF build tools
        shell: bash
        run: |
          set -euo pipefail
          cargo install cargo-build-sbf --version "$SBF_VERSION" --locked --force
          cargo-build-sbf --version
          cargo-test-sbf --version

      - name: Build program
        run: pnpm program:build:localnet
